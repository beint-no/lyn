<!doctype html>
<html lang="{{ .Language.Code }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .SeoTitle }}</title>
  <meta name="description" content="{{ .Description }}">
  {{ if ne .Kind "404" }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
  {{ with asset "site.css" }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Integrity }}">{{ end }}
  <link rel="icon" href="/favicon.svg"><meta property="og:image" content="{{ absURL "/og-image.png" }}">
</head>
<body>
  {{ partial "header" . }}
  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="footer">
    <p>© {{ year }} {{ site.Title }} · <a href="mailto:{{ site.Params.contact.email }}">{{ site.Params.contact.email }}</a></p>
  </footer>
</body>
</html>
